server:
  port: 8080
  tomcat:
    apr:
      enabled: false

langchain4j:
  open-ai:
    chat-model:
      api-key: ${DASH_SCOPE_API_KEY}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      # 当前 DeepSeek OpenAI 兼容接口模型配置
      model-name: deepseek-v3
      # 请求日志和响应日志
      log-requests: true
      log-responses: true
      temperature: 0.9
  ollama:
    chat-model:
      base-url: http://localhost:11434
      model-name: deepseek-r1:1.5b
      # 请求日志和响应日志
      log-requests: true
      log-responses: true
  community:
    dashscope:
      chat-model:
        api-key: ${DASH_SCOPE_API_KEY}
        model-name: qwen-max
      embedding-model:
        api-key: ${DASH_SCOPE_API_KEY}
        model-name: text-embedding-v4
      streaming-chat-model:
        api-key: ${DASH_SCOPE_API_KEY}
        model-name: qwen-max

# 日志级别
logging:
  level:
    org.apache.catalina.core.AprLifecycleListener: ERROR
    root: INFO

spring:
  data:
    mongodb:
      uri: mongodb://localhost:27017/chat_memory_db

  # 基本数据源配置
  datasource:
    url: jdbc:mysql://localhost:3306/guiguxiaozhi?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: liumeilin
    driver-class-name: com.mysql.cj.jdbc.Driver
